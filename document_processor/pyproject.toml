[project]
name = "document_processor"
version = "0.1.0"
description = "Serverless document processor using BigQuery Storage Write API"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-bigquery-storage>=2.24.0",
    "protobuf>=4.25.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "gunicorn>=21.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
]
